<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 146" width="900" height="146" role="img" aria-label="Terminal tips: git log --oneline --graph: see your history as a tree; grep -rn word .: search every file in a folder; chmod +x script.sh: make a script executable; history | tail -20: show your last 20 commands; ping -c 4 github.com: test a connection with 4 packets" xmlns:c2pa="http://c2pa.org/manifest"><style>.b{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}.t{opacity:0;animation:t 20s infinite}@keyframes t{0%{opacity:0}2%,18%{opacity:1}20%,100%{opacity:0}}</style><rect x="2" y="2" width="896" height="142" rx="16" fill="#0b1440" stroke="#5ce1e6" stroke-width="2"/><path d="M2 54H898" stroke="#1d2f7a" stroke-width="2"/><g font-family="Consolas,Menlo,monospace"><text x="26" y="36" font-size="20" fill="#5ce1e6">&gt;_ terminal tips</text><rect class="b" x="226" y="20" width="10" height="19" fill="#fff3dc"/><g class="t" style="animation-delay:0s"><text x="30" y="94" font-size="22" fill="#fff3dc">$ git log --oneline --graph</text><text x="30" y="126" font-size="16" fill="#9ff3f8"># see your history as a tree</text></g><g class="t" style="animation-delay:4s"><text x="30" y="94" font-size="22" fill="#fff3dc">$ grep -rn &quot;word&quot; .</text><text x="30" y="126" font-size="16" fill="#9ff3f8"># search every file in a folder</text></g><g class="t" style="animation-delay:8s"><text x="30" y="94" font-size="22" fill="#fff3dc">$ chmod +x script.sh</text><text x="30" y="126" font-size="16" fill="#9ff3f8"># make a script executable</text></g><g class="t" style="animation-delay:12s"><text x="30" y="94" font-size="22" fill="#fff3dc">$ history | tail -20</text><text x="30" y="126" font-size="16" fill="#9ff3f8"># show your last 20 commands</text></g><g class="t" style="animation-delay:16s"><text x="30" y="94" font-size="22" fill="#fff3dc">$ ping -c 4 github.com</text><text x="30" y="126" font-size="16" fill="#9ff3f8"># test a connection with 4 packets</text></g></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>