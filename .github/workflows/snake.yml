name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1d4ed8&color_dots=#ebedf0,#bfdbfe,#60a5fa,#2563eb,#1e3a8a
            dist/snake-dark.svg?color_snake=#ff3d9a&color_dots=#101a4d,#1c2a78,#2f6bff,#5ce1e6,#ffb454
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
